<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facility Detail</title>
  <link rel="stylesheet" href="css/detail.css" />
</head>
<body>

<header>
  <div class="navbar">
    <a href="index.html">Home Page</a>
    <a href="cancel_booking.html" data-protected>Cancel Booking</a>
    <a href="view_booking_history.html" data-protected>View Booking History</a>
    <a href="submit_feedback.html" data-protected>Feedback</a>
    <a href="about_us.html">About Us</a>
    <a href="announcements.html">Announcements</a>
    <span class="welcome" id="authArea"><a href="login.html" style="color:white;">Sign Up</a></span>
  </div>
</header>

<div class="container" style="max-width:900px;margin:40px auto;">
  <div id="facilityDetail"><p>Loading facility...</p></div>
  <form id="bookingForm" style="display:none; margin-top:20px;">
    <h2>Book Facility</h2>
    <label>Booking Date</label><input type="date" id="booking_date" required />
    <label>Booking Time</label><input type="time" id="booking_time" required />
    <label>Duration (hours)</label><input type="number" id="booking_duration" min="1" max="4" value="1" required />
    <p id="feeText"></p>
    <button type="submit">Confirm Booking</button>
    <p id="bookingMessage" class="message"></p>
  </form>
</div>
<footer><p>&copy; 2026 Condominium Facilities Booking System. All rights reserved. | Created by JiaJie</p></footer>
<div id="loginModal" class="modal">
  <div class="modal-content">
    <p>To access this feature, you need to register or login first.</p>
    <button class="register" onclick="location.href='login.html'">Register / Login</button>
    <button class="ok" onclick="closeLoginModal()">OK</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/detail.js"></script>
</body></html>
