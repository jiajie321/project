<h1>Feedback</h1>
<div class="form-container">
  <form id="feedbackForm">
    <label>Full Name</label><input type="text" id="fb_fullname" required />
    <label>Phone Number</label><input type="text" id="fb_phone" required />
    <label>Email</label><input type="email" id="fb_email" required />
    <label>Description</label><textarea id="fb_description" rows="6" required></textarea>
    <button type="submit">Submit Feedback</button>
    <p id="feedbackMessage" class="message"></p>
  </form>
</div>
